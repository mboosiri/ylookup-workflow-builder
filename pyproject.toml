[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ylookup-workflow-builder"
version = "0.6.0"
description = "Learn, run and adapt spreadsheet workflows from an input, a completed target and context."
requires-python = ">=3.11"
dependencies = ["openpyxl==3.1.5", "pypdf==6.10.0"]

[project.optional-dependencies]
ui = ["streamlit==1.66.0"]

[project.scripts]
ylookup = "ylookup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ylookup = ["logo.svg"]
